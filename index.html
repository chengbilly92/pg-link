<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>電力公司 · 線上桌遊</title><style>
*{box-sizing:border-box}body{margin:0;background:#101b1b;color:#e7e8d9;font-family:system-ui,sans-serif;min-height:100vh;display:grid;place-items:center}main{width:min(90vw,520px);padding:44px;border:1px solid #3c4c43;border-radius:22px;background:#192725}small{letter-spacing:.22em;color:#d5ad5f}h1{font-size:40px;margin:14px 0}p{line-height:1.8;color:#b8c2bb}a{display:inline-block;padding:12px 24px;background:#ddbc72;border-radius:8px;color:#142725;text-decoration:none}a[hidden]{display:none}
</style></head><body><main><small>POWER GRID · RECHARGED</small><h1>電力公司</h1><p id="status">正在尋找目前的遊戲連線……</p><a id="enter" hidden>進入遊戲</a><p>如果主機尚未開啟，請稍後再試。這個固定入口會帶你前往目前的遊戲網址。</p></main><script>
(async()=>{try{const response=await fetch('./url.json?t='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error();const data=await response.json();const destination=new URL(data.url);if(destination.protocol!=='https:'||destination.username||destination.password)throw Error();const query=new URLSearchParams(location.search);const room=query.get('room');if(room&&/^[A-Z2-9]{6}$/i.test(room))destination.searchParams.set('room',room.toUpperCase());const link=document.getElementById('enter');link.href=destination.href;link.hidden=false;document.getElementById('status').textContent='連線已就緒，即將進入遊戲。';setTimeout(()=>location.replace(destination.href),700);}catch{document.getElementById('status').textContent='尚未設定遊戲網址。請房主開啟主機並更新入口，稍後重新整理。'}})();
</script></body></html>
